# apply — main 에 병합된 변경을 승인 뒤에 적용하는 워크플로.
# main 에 병합될 때(infra 가 바뀐 경우만): ① 조회용 역할로 plan 을 tfplan 으로 저장해 상태 버킷의 plan 위치에 올리고 sha256 을 남긴다
# ② 환경 apply(승인자 승인) 뒤 적용용 역할로 올려 둔 tfplan 만 terraform apply 한다. 승인 뒤 plan 을 다시 계산하지 않고 자동 승인 옵션을 쓰지 않는다.
name: apply
on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "notifications/**"
      - "scripts/collector.py"
      - "app/web/nginx.conf"
      - ".github/workflows/apply.yml"
permissions:
  id-token: write
  contents: read
concurrency:
  group: apply-dev
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      plan_sha256: ${{ steps.save.outputs.plan_sha256 }}
    defaults:
      run:
        working-directory: infra/environments/dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ vars.PLAN_ROLE_NAME }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false
      - name: terraform init
        env:
          STATE_BUCKET: ${{ vars.STATE_BUCKET }}
          AWS_REGION_VAR: ${{ vars.AWS_REGION }}
        run: >-
          terraform init -input=false
          -backend-config="bucket=${STATE_BUCKET}"
          -backend-config="key=dev/terraform.tfstate"
          -backend-config="region=${AWS_REGION_VAR}"
          -backend-config="use_lockfile=true"
      - run: terraform validate
      - run: terraform plan -input=false -lock-timeout=60s -out=tfplan
      - name: tfplan 을 상태 버킷의 plan 위치에 올리고 sha256 과 요약(개수·주소만)을 남긴다
        id: save
        env:
          STATE_BUCKET: ${{ vars.STATE_BUCKET }}
        run: |
          sha=$(sha256sum tfplan | cut -d' ' -f1)
          echo "plan_sha256=${sha}" >> "$GITHUB_OUTPUT"
          echo "::notice title=승인할 tfplan::sha256 ${sha} (커밋 ${GITHUB_SHA:0:12}) — 이 값을 실행 요약의 plan 개수·주소와 함께 확인한 뒤 승인"
          aws s3 cp tfplan "s3://${STATE_BUCKET}/plans/${GITHUB_SHA}/tfplan" --only-show-errors
          terraform show -json tfplan > "${RUNNER_TEMP}/plan.json"
          {
            echo "### 승인할 plan (커밋 ${GITHUB_SHA:0:12})"
            echo "- tfplan sha256: \`${sha}\`"
            jq -r '
              [.resource_changes[]? | select(.change.actions != ["no-op"] and .change.actions != ["read"])] as $c
              | "- 추가 \([$c[] | select(.change.actions | index("create"))] | length) · 변경 \([$c[] | select(.change.actions == ["update"])] | length) · 삭제 \([$c[] | select(.change.actions | index("delete"))] | length) · 교체 \([$c[] | select((.change.actions | index("delete")) and (.change.actions | index("create")))] | length) (교체는 추가·삭제에 각각 포함 — terraform plan 의 to add / to destroy 와 같은 셈법)",
                "",
                ($c[] | "- `\(.address)` — \(.change.actions | join("/"))")
            ' "${RUNNER_TEMP}/plan.json"
          } >> "$GITHUB_STEP_SUMMARY"
  apply:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: apply
    defaults:
      run:
        working-directory: infra/environments/dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ vars.APPLY_ROLE_NAME }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false
      - name: terraform init
        env:
          STATE_BUCKET: ${{ vars.STATE_BUCKET }}
          AWS_REGION_VAR: ${{ vars.AWS_REGION }}
        run: >-
          terraform init -input=false
          -backend-config="bucket=${STATE_BUCKET}"
          -backend-config="key=dev/terraform.tfstate"
          -backend-config="region=${AWS_REGION_VAR}"
          -backend-config="use_lockfile=true"
      - name: 승인한 tfplan 을 내려받고 sha256 이 plan Job 이 남긴 값과 같은지 확인
        env:
          STATE_BUCKET: ${{ vars.STATE_BUCKET }}
          EXPECTED_SHA: ${{ needs.plan.outputs.plan_sha256 }}
        run: |
          aws s3 cp "s3://${STATE_BUCKET}/plans/${GITHUB_SHA}/tfplan" tfplan --only-show-errors
          actual=$(sha256sum tfplan | cut -d' ' -f1)
          test "${actual}" = "${EXPECTED_SHA}" || { echo "tfplan sha256 불일치 — 적용하지 않음"; exit 1; }
          echo "tfplan sha256 일치: ${actual}"
      - run: terraform apply -input=false -lock-timeout=60s tfplan
