server {
    listen 80;

    location / {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location = /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Section 6 (Real Alerting): deliberately broken on purpose, so the
    # observability pipeline has something real to catch.
    location = /error {
        return 500 "intentional failure for the alerting lab\n";
        add_header Content-Type text/plain;
    }
}
